<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech to Text App</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f4f6f9;
    padding: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 {
    margin-bottom: 10px;
}

#status {
    font-weight: bold;
    margin-bottom: 10px;
}

button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.start { background: green; color: white; }
.stop { background: red; color: white; }
.copy { background: blue; color: white; }
.clear { background: gray; color: white; }

#output {
    margin-top: 15px;
    min-height: 100px;
    min-height: 120px;
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 6px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">
    <h2>🎤 Speech to Text</h2>

    <p id="status" style="color:red;">🔴 Not Listening</p>

    <button class="start" onclick="start()">Start</button>
    <button class="stop" onclick="stop()">Stop</button>
    <button class="copy" onclick="copyText()">Copy</button>
    <button class="clear" onclick="clearText()">Clear</button>

    <div id="output">Your speech will appear here...</div>
</div>

<script>
let recognition;
let isListening = false;

function start() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech Recognition not supported in this browser");
        return;
    }

    if (isListening) return;

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    document.getElementById("status").innerText = "🟢 Listening...";
    document.getElementById("status").style.color = "green";

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript;
        document.getElementById("output").innerText += " " + text;
        let text = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            text += event.results[i][0].transcript;
        }
        document.getElementById("output").innerText = text;
    };

    recognition.onerror = function(event) {
        alert("Error: " + event.error);
    };

    recognition.onend = function() {
        isListening = false;
        document.getElementById("status").innerText = "🔴 Stopped";
        document.getElementById("status").style.color = "red";
    };

    recognition.start();
    isListening = true;
}

function stop() {
    if (recognition) recognition.stop();
    if (recognition && isListening) {
        recognition.stop();
    }
}

function copyText() {
    let text = document.getElementById("output").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}

function clearText() {
    document.getElementById("output").innerText = "";
}
</script>

</body>
</html>
</html>
